[project]
name = "yq-ai-py-agent"
version = "0.1.0"
description = "Python agent service for log diagnosis and RAG analysis."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.116,<0.117",
    "uvicorn[standard]>=0.35,<0.36",
    "pydantic-settings>=2.10,<2.11",
    "httpx>=0.28,<0.29",
    "langchain==1.2.15",
    "langchain-openai==1.1.13",
    "langchain-text-splitters>=1.1,<1.2",
    "openai>=2.12,<3",
    "pymilvus>=2.6,<2.7",
    "llama-index-core>=0.14.21",
    "llama-index-vector-stores-milvus>=1.1.0",
    "pypdf>=6.4,<6.5",
    "python-docx>=1.2,<1.3",
    "websockets>=15.0,<16",
]

[project.optional-dependencies]
local-asr = [
    "funasr>=1.2,<1.3",
    "modelscope>=1.30,<1.31",
    "torch>=2.2,<3",
    "torchaudio>=2.2,<3",
]
dev = [
    "pytest>=8.4,<8.5",
    "ruff>=0.12,<0.13",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
