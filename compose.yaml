name: careerflow-local
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: training_career_local
      MYSQL_USER: training_local
      MYSQL_PASSWORD: training-local-db
    ports:
      - "127.0.0.1:3306:3306"
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "training-local-redis"]
    volumes:
      - redis-data:/data
volumes:
  mysql-data:
  redis-data:
